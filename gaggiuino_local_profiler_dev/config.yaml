name: "GLP DEV — Gaggiuino Local Profiler (unstable)"
# Rewritten automatically by .github/workflows/build-dev.yaml in the main
# repository on every push to `dev`. Home Assistant offers an update when
# this value changes, so it must be unique per build -- it is NOT the app's
# own semantic version (that still lives in the main repo's config.yaml and
# lib/constants.js).
version: "dev-20260808_1545"
slug: "gaggiuino_local_profiler_dev"
description: "UNSTABLE dev builds of GLP, for maintainer testing only. Runs alongside the stable app with its own database. Not for end users."
url: "https://github.com/mxkissnr/glp-dev-app"
# Same image repository as stable -- only the tag differs. The dev tag is
# built from the `dev` branch and pinned via `version` above.
image: "ghcr.io/mxkissnr/gaggiuino-local-profiler/{arch}"
# amd64 only -- the dev channel is built for the maintainer's HAOS box and
# build-dev.yaml publishes no other architecture. Listing one here that has no
# image would let Home Assistant offer an install that then fails on pull.
# The stable app still ships all three.
arch:
  - amd64
startup: application
boot: manual
homeassistant_api: true
hassio_api: true
init: false
ingress: true
# Ingress is scoped per installed app, so the in-container port can stay 8099
# and only the host-side mapping below has to avoid colliding with stable.
ingress_port: 8099
services:
  - mqtt:want
ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: "GLP DEV web interface (8098 on the host, so it never collides with the stable app on 8099)"
panel_icon: mdi:flask-outline
panel_title: "GLP DEV"
options:
  machine_host: "gaggiuino.local"
  sync_interval: 5
  switch_entity: ""
  preheat_time: 20
  enable_orders: false
  debug_logging: true
schema:
  machine_host: str
  sync_interval: int(1,60)
  switch_entity: str?
  preheat_time: int(1,120)?
  enable_orders: bool?
  debug_logging: bool?

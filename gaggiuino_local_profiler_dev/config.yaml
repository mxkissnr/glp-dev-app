name: "GLP DEV — Gaggiuino Local Profiler (unstable)"
# Rewritten automatically by .github/workflows/build-dev.yaml in the main
# repository on every push to `dev`. Home Assistant offers an update when
# this value changes, so it must be unique per build -- it is NOT the app's
# own semantic version (that still lives in the main repo's config.yaml and
# lib/constants.js).
version: "dev-20260905_0946"
slug: "gaggiuino_local_profiler_dev"
description: "UNSTABLE dev builds of GLP, for maintainer testing only. Runs alongside the stable app with its own database. Not for end users."
url: "https://github.com/mxkissnr/glp-dev-app"
# Same image repository as stable -- only the tag differs. The dev tag is
# built from the `dev` branch and pinned via `version` above.
image: "ghcr.io/mxkissnr/gaggiuino-local-profiler/{arch}"
# #702: matches build-dev.yaml's matrix -- listing an arch here that has no
# published image would let Home Assistant offer an install that then fails
# on pull, so this list must always agree with what that workflow builds.
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: manual
homeassistant_api: true
hassio_api: true
init: false
ingress: true
# Ingress is scoped per installed app, so the in-container port can stay 8099
# and only the host-side mapping below has to avoid colliding with stable.
ingress_port: 8099
services:
  - mqtt:want
ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: "GLP DEV web interface (8098 on the host, so it never collides with the stable app on 8099)"
panel_icon: mdi:flask-outline
panel_title: "GLP DEV"
# #703: machine_host/switch_entity dropped, matching the stable app's own
# #662 deprecation (config.yaml's options/schema aren't touched by
# build-dev.yaml's auto-bump -- only `version:` is -- so this drifted out
# of sync until fixed by hand here). Machine #1 configures only in-app now,
# via Settings -> Machines, same as every other machine.
options:
  sync_interval: 5
  preheat_time: 20
  enable_orders: false
  debug_logging: true
  # #803: default true (open) so no existing install's behaviour changes on
  # upgrade -- see lib/data.js's isApiPortExposed() and routes/system.js's
  # GET /api/token. Turning this off returns 403 from that one endpoint for
  # any request that didn't arrive via HA Ingress; it does not unmap port
  # 8099 itself, and it does not narrow the trust boundary below the whole
  # Supervisor add-on network (isFromSupervisor() in server.js trusts all of
  # 172.30.0.0/16, not just the Ingress proxy). Breaks direct-port browser
  # access to the app entirely (this includes the installable PWA -- it's
  # just the installed form of the same UI), plus first-time setup of the
  # GLP Order Card's direct-URL mode, since none of those have any other way
  # to obtain a token (an already-configured Order Card that already has
  # glp_token in its YAML is unaffected). See DOCS.md's "Trust model" section.
  expose_api_port: true
schema:
  sync_interval: int(1,60)
  preheat_time: int(1,120)?
  enable_orders: bool?
  debug_logging: bool?
  expose_api_port: bool?

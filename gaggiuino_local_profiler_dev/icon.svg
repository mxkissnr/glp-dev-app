<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Warning-yellow border ring so GLP DEV reads as visually distinct from
       the stable app's icon at a glance in the add-on list/sidebar, same
       accent color (#f5c518) already used by the in-app "UNSTABLE DEV
       BUILD" banner (dev-banner.js): one consistent "this is dev" color
       identity across the whole app, not just this icon. -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#f5c518" stroke-width="16"/>

  <!-- MDI coffee icon (mdi:coffee) centered, recolored to the same
       warning-yellow instead of the stable app's amber -->
  <g transform="translate(86, 60) scale(14.17)" fill="#f5c518">
    <path d="M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z"/>
  </g>

  <!-- DEV label at bottom, replacing the stable icon's "GLP" -->
  <text x="256" y="462"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="52" font-weight="800" fill="#f5c518" text-anchor="middle" letter-spacing="0"
        opacity="0.95">DEV</text>
</svg>
